<!doctype html>
<html lang="en" data-rm-lock>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rainmaker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0E14">
<style>
:root{--bg:#0A0E14;--card:#121925;--fg:#e4ebf2;--muted:#8d9bab;--line:#243042;--accent:#7fb7c9;--bad:#e3a08a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
 font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
h1{font-weight:500;font-size:1.6rem;margin:0;letter-spacing:.01em}
label{color:var(--muted);font-size:.9rem}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:#0A0E14;cursor:pointer}
button[disabled]{opacity:.6}
#msg{min-height:1.5em;margin:0;color:var(--bad);font-size:.9rem}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Rainmaker</h1>
  <label for="c" id="lab">Access code</label>
  <input id="c" type="password" autocomplete="current-password" autofocus required>
  <button id="go">Open</button>
  <p id="msg" role="status"></p>
</form>
<script>
(() => {
  const SALT = 'RCZmXM65gejOA2tbnGoEng==', ITER = 600000, KK = 'rainmaker-site-key';
  const es = (navigator.language || '').startsWith('es');
  const T = es ? { lab: 'Código de acceso', go: 'Abrir', bad: 'Código incorrecto.', wait: 'Abriendo…', net: 'No se pudo cargar la app.' }
               : { lab: 'Access code', go: 'Open', bad: 'That code is not right.', wait: 'Opening…', net: 'Could not load the app.' };
  const $ = id => document.getElementById(id), b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  $('lab').textContent = T.lab; $('go').textContent = T.go;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let blob = fetch('app.enc', { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); });
  async function open(raw) {
    const buf = new Uint8Array(await blob);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)));
    document.open(); document.write(html); document.close();
  }
  async function fromSaved() {
    let s = null; try { s = localStorage.getItem(KK); } catch (e) {}
    if (!s) return false;
    try { await open(b64(s)); return true; } catch (e) { try { localStorage.removeItem(KK); } catch (e2) {} return false; }
  }
  fromSaved().then(ok => { if (!ok) { $('f').hidden = false; $('c').focus(); } });
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault(); const btn = $('go'); btn.disabled = true; $('msg').textContent = T.wait;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('c').value.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
      const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(SALT), iterations: ITER }, base, 256));
      try { await blob; } catch (e) { blob = fetch('app.enc').then(r => r.arrayBuffer()); }
      try { await open(raw); } catch (e) { $('msg').textContent = T.bad; btn.disabled = false; return; }
      try { localStorage.setItem(KK, btoa(String.fromCharCode(...raw))); } catch (e) {}
    } catch (e) { $('msg').textContent = T.net; btn.disabled = false; }
  });
})();
</script>
</body>
</html>
